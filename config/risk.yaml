# Risk / portfolio / execution parameters — per 06_RISK_PORTFOLIO_EXECUTION.md

portfolio:
  allocation_method: risk_parity       # equal vol contribution across strategies
  portfolio_vol_target: 0.28           # 28% annualized — higher return target for S&P-beating
  max_leverage: 8.0                    # gross leverage safety cap
  correlation_lookback: 63             # days for correlation estimation

  correlation_haircuts:
    avg_corr_threshold_high: 0.6       # when avg pairwise corr exceeds this
    risk_scale_at_high_corr: 0.60      # scale risk budget to 60%
    avg_corr_threshold_extreme: 0.8
    risk_scale_at_extreme_corr: 0.30

drawdown_ladder:
  enabled: false                       # V4: disabled — net destructive on single-instrument ES
  thresholds:
    - threshold: 0.20                  # DD >= 20%: reduce to 80% (crisis territory)
      risk_multiplier: 0.80
    - threshold: 0.30                  # DD >= 30%: reduce to 50%
      risk_multiplier: 0.50
    - threshold: 0.40                  # DD >= 40%: reduce to 25%
      risk_multiplier: 0.25
    - threshold: 0.50                  # DD >= 50%: flat + cooldown (capital preservation)
      risk_multiplier: 0.00
  cooldown_days: 10
  recovery_window: 20                  # days of stable performance to re-enter
  recovery_min_sharpe: -0.5            # relaxed: allow re-entry during recovery
  max_cooldown_days: 30                # hard cap — force re-entry after 30 days

bear_filter:
  enabled: false                       # disabled: trend signal already flips short in bears
  threshold: 0.30
  min_scale: 0.40
  momentum_horizons: [5, 10, 21, 42, 63, 126, 252]
  vol_acceleration_window: 21

regime_scaling:
  enabled: false                       # disabled: trend signal handles regime adaptation
  scaling_factor: 0.35
  min_scale: 0.50

vol_management:
  enabled: false
  vol_target: 0.22
  estimator: expanding_ewma
  vol_floor_pct: 0.50
  vol_cap_multiplier: 1.4

margin:
  max_utilization: 0.35                # max 35% of equity as margin
  stress_margin_multiplier: 1.5        # stress test: margins spike 50%
  leverage_cap_under_stress: 2.0

execution:
  cost_model:
    spread_method: fixed_ticks         # use avg_spread_ticks from instrument config
    slippage_method: linear            # linear in size/ADV ratio
    slippage_base_bps: 1.0             # baseline slippage in bps
    slippage_size_coefficient: 5.0     # additional bps per 1% of ADV
    impact_power: 0.5                  # square root impact model exponent

  participation:
    max_adv_pct: 0.01                  # max 1% of ADV per order
    high_vol_adv_pct: 0.005            # reduced to 0.5% in high vol
    vol_regime_threshold: 0.75         # percentile for "high vol" regime
