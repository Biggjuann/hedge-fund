# Strategy parameters — per 04_STRATEGY_LIBRARY.md
# V3: Fixed to match research spec exactly

strategies:
  S1_trend:
    enabled: true
    lookback_periods: [21, 63, 252]     # per spec: 1M, 3M, 12M horizons
    aggregation_method: sign_mean        # per spec: sign(return), then average
    vol_lookback: 60                     # EWMA center-of-mass in days
    signal_clamp: [-1.0, 1.0]
    target_vol_per_instrument: 0.15      # 15% annualized per instrument
    rebalance_frequency: weekly           # weekly: reduces turnover ~5x, saves ~0.8% annual cost
    bar_aggregation: 1D

  S2_carry:
    enabled: true
    carry_lookback: 63                   # days for carry/mean-reversion estimation
    rank_long_quantile: 0.33
    rank_short_quantile: 0.33
    vol_lookback: 60
    target_vol_per_instrument: 0.15      # 15% annualized per instrument
    rebalance_frequency: weekly          # weekly for mean-reversion
    bar_aggregation: 1D

  S3_vol_breakout:
    enabled: false                       # disabled: negative Sharpe on ES across all variants
    range_lookback: 20
    atr_lookback: 14
    breakout_threshold_pct: 1.5
    atr_percentile_threshold: 80
    vol_lookback: 60
    target_vol_per_instrument: 0.05
    max_loss_per_trade_pct: 0.02
    rebalance_frequency: daily
    bar_aggregation: 1D

  S4_williams_r:
    enabled: false                       # 0.87 corr with S1, dilutes Sharpe — kept for reference
    lookback_periods: [126, 189, 252]   # long-horizon %R momentum (6M, 9M, 12M)
    vol_lookback: 60
    target_vol_per_instrument: 0.15
    rebalance_frequency: weekly
    bar_aggregation: 1D

  S5_spread_mr:
    enabled: false  # phase 2
    approved_spreads: []
    zscore_lookback: 60
    entry_z: 2.0
    exit_z: 0.5
    stop_atr_multiple: 3.0
    structural_break_window: 252
    min_liquidity_ratio: 0.1
